server:
  # Порт подставляется автоматически Render'ом через $PORT, либо 8080 по умолчанию
  port: ${PORT:8080}

bot:
  # Токен Telegram берется строго из переменной окружения
  token: ${BOT_TOKEN}
  name: ${BOT_NAME:BoxingGod_Bot}

spring:
  application:
    name: BoxingGod_Bot

  ai:
    openai:
      # Ключ Groq API берется строго из переменной окружения
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: openai/gpt-oss-120b
          max-tokens: 2500
          temperature: 0.6

  # База данных H2 с сохранением в файл на диске
  datasource:
    url: jdbc:h2:file:./data/boxingdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false